<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Login — BloodLink</title>
<meta name="description" content="Login to Blood Bank Management System"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<link rel="stylesheet" href="styles.css"/>
<link rel="stylesheet" href="pages.css"/>
</head>
<body class="auth-page">
<div class="topbar-theme">
  <button class="dark-toggle" id="theme-btn" title="Toggle theme"><i class="fas fa-sun"></i></button>
</div>

<div class="login-wrap">
  <div class="login-header">
    <a href="index.html" class="login-logo">
      <div class="login-logo-icon"><i class="fas fa-tint"></i></div>
      <span class="login-logo-text">BloodLink</span>
    </a>
    <h2>Welcome Back</h2>
    <p>Sign in to access your dashboard</p>
  </div>

  <!-- Role Tabs -->
  <div class="role-tabs" id="role-tabs">
    <button class="role-tab" id="tab-admin"   onclick="setRole('admin')"  ><i class="fas fa-shield-halved"></i><span>Admin</span></button>
    <button class="role-tab" id="tab-student" onclick="setRole('student')"><i class="fas fa-graduation-cap"></i><span>Student</span></button>
    <button class="role-tab" id="tab-faculty" onclick="setRole('faculty')"><i class="fas fa-chalkboard-teacher"></i><span>Faculty</span></button>
  </div>

  <div class="login-card">
    <div id="login-alert" class="alert alert-error"></div>

    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="login-email" placeholder="you@example.com" autocomplete="email"/>
    </div>
    <div class="form-group">
      <label>Password</label>
      <div class="pw-wrap">
        <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password"/>
        <button class="pw-eye" type="button" title="Show/Hide password"><i class="fas fa-eye"></i></button>
      </div>
    </div>

    <button class="btn-submit" id="login-btn" onclick="doLogin()">
      <i class="fas fa-arrow-right-to-bracket"></i> Sign In
    </button>

    <div class="login-footer">
      Don't have an account? <a href="register.html">Register here</a>
    </div>
    <div class="login-footer" style="margin-top:.5rem;">
      <a href="index.html"><i class="fas fa-arrow-left"></i> Back to Home</a>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="script.js"></script>
<script>
requireGuest(); // redirect if already logged in

let currentRole = 'student';

// Pre-select role from URL param
const urlRole = new URLSearchParams(window.location.search).get('role');
if (urlRole && ['admin','student','faculty'].includes(urlRole)) currentRole = urlRole;

function setRole(role) {
  currentRole = role;
  document.querySelectorAll('.role-tab').forEach(t => t.classList.remove('active'));
  document.getElementById(`tab-${role}`)?.classList.add('active');
}
setRole(currentRole);

async function doLogin() {
  const email = val('login-email');
  const pass  = val('login-password');
  hideAlert('login-alert');
  if (!email || !pass) { showAlert('login-alert', 'Please enter your email and password.'); return; }

  const btn = document.getElementById('login-btn');
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';

  try {
    const res = await apiFetch('/auth/login', { method: 'POST', body: { email, password: pass, role: currentRole } });
    saveAuth(res.token, { id: res.userId, name: res.name, email: res.email, role: res.role, roll_number: res.roll_number, designation: res.designation });
    toast('Welcome back, ' + (res.name || email.split('@')[0]) + '!', 'success');
    setTimeout(() => {
      if (res.role === 'admin') window.location.href = 'dashboard_admin.html';
      else window.location.href = 'dashboard_user.html';
    }, 700);
  } catch (e) {
    showAlert('login-alert', e.message || 'Login failed. Check your credentials.');
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i> Sign In';
  }
}

// Enter key support
document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

// Dark mode
const themeBtn = document.getElementById('theme-btn');
const saved = localStorage.getItem('bb_theme');
if (saved === 'light') { document.body.classList.add('light-mode'); themeBtn.innerHTML = '<i class="fas fa-moon"></i>'; }
themeBtn.addEventListener('click', () => {
  document.body.classList.toggle('light-mode');
  const isLight = document.body.classList.contains('light-mode');
  localStorage.setItem('bb_theme', isLight ? 'light' : 'dark');
  themeBtn.innerHTML = isLight ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun"></i>';
});

// Eye toggle (handled by script.js initEyeToggles on DOMContentLoaded)
</script>
</body>
</html>
