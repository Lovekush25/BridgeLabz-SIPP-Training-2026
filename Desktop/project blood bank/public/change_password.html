<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Change Password — BloodLink</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<link rel="stylesheet" href="styles.css"/>
<link rel="stylesheet" href="pages.css"/>
</head>
<body class="auth-page">
<div class="topbar-theme"><button class="dark-toggle" id="theme-btn"><i class="fas fa-sun"></i></button></div>

<div class="cp-wrap">
  <div class="cp-header">
    <div class="cp-logo">
      <div class="cp-logo-icon"><i class="fas fa-key"></i></div>
      <span class="cp-logo-text">BloodLink</span>
    </div>
    <h2>Change Password</h2>
    <p id="cp-user-info">Updating password for your account</p>
  </div>

  <div class="cp-card">
    <div id="cp-alert" class="alert alert-error"></div>
    <div id="cp-ok"    class="alert alert-success"></div>

    <div class="form-group">
      <label>Current Password *</label>
      <div class="pw-wrap">
        <input type="password" id="cp-current" placeholder="Your current password"/>
        <button class="pw-eye" type="button"><i class="fas fa-eye"></i></button>
      </div>
    </div>

    <div class="form-group">
      <label>New Password *</label>
      <div class="pw-wrap">
        <input type="password" id="cp-new" placeholder="Min 6 characters" oninput="checkStrength(this.value)"/>
        <button class="pw-eye" type="button"><i class="fas fa-eye"></i></button>
      </div>
      <div class="strength-bar"><div id="strength-indicator" style="width:0%;background:var(--danger);"></div></div>
      <div style="font-size:.75rem;color:var(--muted);margin-top:.25rem;" id="strength-label"></div>
    </div>

    <div class="form-group">
      <label>Confirm New Password *</label>
      <div class="pw-wrap">
        <input type="password" id="cp-confirm" placeholder="Repeat new password"/>
        <button class="pw-eye" type="button"><i class="fas fa-eye"></i></button>
      </div>
    </div>

    <!-- Password Requirements -->
    <div style="background:rgba(200,16,46,.06);border:1px solid var(--border);border-radius:10px;padding:1rem;margin-bottom:1.25rem;font-size:.82rem;color:var(--muted);">
      <strong style="color:var(--text);">Password Requirements:</strong>
      <ul style="margin-top:.4rem;list-style:none;padding:0;display:flex;flex-wrap:wrap;gap:.4rem;">
        <li id="req-len"><i class="fas fa-circle" style="font-size:.5rem;"></i> Min 6 chars</li>
        <li id="req-upper"><i class="fas fa-circle" style="font-size:.5rem;"></i> Uppercase</li>
        <li id="req-num"><i class="fas fa-circle" style="font-size:.5rem;"></i> Number</li>
      </ul>
    </div>

    <button class="btn-submit" id="cp-btn" onclick="changePassword()">
      <i class="fas fa-lock"></i> Change Password
    </button>

    <div class="cp-footer" style="margin-top:1.25rem;">
      <a href="dashboard_user.html"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="script.js"></script>
<script>
requireAuth(['student', 'faculty']);
const user = getUser();
document.getElementById('cp-user-info').textContent = `Changing password for ${user.email || 'your account'}`;

function checkStrength(pw) {
  const bar   = document.getElementById('strength-indicator');
  const label = document.getElementById('strength-label');
  const reqLen   = document.getElementById('req-len');
  const reqUpper = document.getElementById('req-upper');
  const reqNum   = document.getElementById('req-num');

  const hasLen   = pw.length >= 6;
  const hasUpper = /[A-Z]/.test(pw);
  const hasNum   = /[0-9]/.test(pw);

  reqLen.style.color   = hasLen   ? 'var(--success)' : 'var(--muted)';
  reqUpper.style.color = hasUpper ? 'var(--success)' : 'var(--muted)';
  reqNum.style.color   = hasNum   ? 'var(--success)' : 'var(--muted)';

  const score = [hasLen, hasUpper, hasNum, pw.length >= 10, /[!@#$%^&*]/.test(pw)].filter(Boolean).length;
  const configs = [
    { w:'0%',   bg:'transparent',     text:'' },
    { w:'25%',  bg:'var(--danger)',    text:'Weak' },
    { w:'50%',  bg:'var(--warn)',      text:'Fair' },
    { w:'75%',  bg:'var(--gold)',      text:'Good' },
    { w:'90%',  bg:'var(--success)',   text:'Strong' },
    { w:'100%', bg:'var(--success)',   text:'Very Strong' },
  ];
  const c = configs[Math.min(score, 5)];
  bar.style.width      = c.w;
  bar.style.background = c.bg;
  label.textContent    = c.text;
  label.style.color    = c.bg;
}

async function changePassword() {
  hideAlert('cp-alert'); hideAlert('cp-ok');
  const current = document.getElementById('cp-current').value;
  const newPw   = document.getElementById('cp-new').value;
  const confirm = document.getElementById('cp-confirm').value;

  if (!current)     { showAlert('cp-alert', 'Please enter your current password.');  return; }
  if (!newPw)       { showAlert('cp-alert', 'Please enter a new password.');          return; }
  if (newPw.length < 6) { showAlert('cp-alert', 'New password must be at least 6 characters.'); return; }
  if (newPw !== confirm){ showAlert('cp-alert', 'New passwords do not match.');       return; }
  if (newPw === current){ showAlert('cp-alert', 'New password must be different from current password.'); return; }

  const btn = document.getElementById('cp-btn');
  btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Changing...';

  try {
    const res = await apiFetch('/auth/change-password', {
      method: 'POST',
      body: { current_password: current, new_password: newPw }
    });
    showAlert('cp-ok', res.message || 'Password changed successfully!', 'success');
    toast('Password changed! Please log in again.', 'success');
    // Clear fields
    document.getElementById('cp-current').value = '';
    document.getElementById('cp-new').value = '';
    document.getElementById('cp-confirm').value = '';
    checkStrength('');
    // Log out after 2s for security
    setTimeout(() => { clearAuth(); window.location.href = 'login.html'; }, 2500);
  } catch(e) {
    showAlert('cp-alert', e.message || 'Failed to change password.');
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-lock"></i> Change Password';
  }
}

// Dark mode
const themeBtn = document.getElementById('theme-btn');
if (localStorage.getItem('bb_theme') === 'light') { document.body.classList.add('light-mode'); themeBtn.innerHTML = '<i class="fas fa-moon"></i>'; }
themeBtn.addEventListener('click', () => {
  document.body.classList.toggle('light-mode');
  const isLight = document.body.classList.contains('light-mode');
  localStorage.setItem('bb_theme', isLight ? 'light' : 'dark');
  themeBtn.innerHTML = isLight ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun"></i>';
});
</script>
</body>
</html>
