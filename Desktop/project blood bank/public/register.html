<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Register — BloodLink</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<link rel="stylesheet" href="styles.css"/>
<link rel="stylesheet" href="pages.css"/>
</head>
<body class="auth-page">
<div class="topbar-theme"><button class="dark-toggle" id="theme-btn"><i class="fas fa-sun"></i></button></div>

<div class="reg-wrap">
  <div class="reg-header">
    <a href="index.html" class="reg-logo">
      <div class="reg-logo-icon"><i class="fas fa-tint"></i></div>
      <span class="reg-logo-text">BloodLink</span>
    </a>
    <h2>Create Your Account</h2>
    <p>Join the university blood bank network</p>
  </div>

  <div class="role-toggle">
    <button class="rtab active" id="rtab-student" onclick="setRegRole('student')">
      <i class="fas fa-graduation-cap"></i> Student
    </button>
    <button class="rtab" id="rtab-faculty" onclick="setRegRole('faculty')">
      <i class="fas fa-chalkboard-teacher"></i> Faculty
    </button>
  </div>

  <div class="reg-card">
    <div id="reg-alert" class="alert alert-error"></div>
    <div id="reg-success-alert" class="alert alert-success"></div>

    <div class="form-row">
      <div class="form-group">
        <label>Full Name *</label>
        <input type="text" id="r-name" placeholder="Your full name"/>
      </div>
      <div class="form-group">
        <label>Email Address *</label>
        <input type="email" id="r-email" placeholder="you@university.edu"/>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Password *</label>
        <div class="pw-wrap">
          <input type="password" id="r-pass" placeholder="Min 6 characters"/>
          <button class="pw-eye" type="button"><i class="fas fa-eye"></i></button>
        </div>
      </div>
      <div class="form-group">
        <label>Confirm Password *</label>
        <div class="pw-wrap">
          <input type="password" id="r-pass2" placeholder="Repeat password"/>
          <button class="pw-eye" type="button"><i class="fas fa-eye"></i></button>
        </div>
      </div>
    </div>

    <!-- Student-only field -->
    <div class="form-group" id="roll-field">
      <label>University Roll Number *</label>
      <input type="text" id="r-roll" placeholder="e.g. 2021CSE045"/>
    </div>

    <!-- Faculty-only field -->
    <div class="form-group hidden" id="designation-field">
      <label>Designation *</label>
      <input type="text" id="r-designation" placeholder="e.g. Assistant Professor, HOD"/>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" id="r-phone" placeholder="+91 98765 43210"/>
      </div>
      <div class="form-group">
        <label>Blood Group</label>
        <select id="r-blood">
          <option value="">-- Select --</option>
          <option>A+</option><option>A-</option>
          <option>B+</option><option>B-</option>
          <option>AB+</option><option>AB-</option>
          <option>O+</option><option>O-</option>
        </select>
      </div>
    </div>

    <button class="btn-submit" id="reg-btn" onclick="doRegister()">
      <i class="fas fa-user-plus"></i> Create Account
    </button>

    <div class="reg-footer">
      Already have an account? <a href="login.html">Sign in here</a>
    </div>
    <div class="reg-footer" style="margin-top:.5rem;">
      <a href="index.html"><i class="fas fa-arrow-left"></i> Back to Home</a>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="script.js"></script>
<script>
requireGuest();
let regRole = 'student';

function setRegRole(role) {
  regRole = role;
  document.querySelectorAll('.rtab').forEach(t => t.classList.remove('active'));
  document.getElementById(`rtab-${role}`).classList.add('active');
  if (role === 'student') {
    document.getElementById('roll-field').classList.remove('hidden');
    document.getElementById('designation-field').classList.add('hidden');
  } else {
    document.getElementById('roll-field').classList.add('hidden');
    document.getElementById('designation-field').classList.remove('hidden');
  }
}

async function doRegister() {
  hideAlert('reg-alert');
  const name = val('r-name'), email = val('r-email'),
        pass  = val('r-pass'), pass2 = val('r-pass2'),
        roll  = val('r-roll'), desig = val('r-designation'),
        phone = val('r-phone'), blood = val('r-blood');

  if (!name || !email || !pass) { showAlert('reg-alert', 'Name, email, and password are required.'); return; }
  if (pass !== pass2)           { showAlert('reg-alert', 'Passwords do not match.');                  return; }
  if (pass.length < 6)          { showAlert('reg-alert', 'Password must be at least 6 characters.');  return; }
  if (regRole === 'student' && !roll) { showAlert('reg-alert', 'Roll number is required for students.'); return; }

  const btn = document.getElementById('reg-btn');
  btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating...';

  try {
    const body = { name, email, password: pass, role: regRole, phone, blood_group: blood || null };
    if (regRole === 'student') body.roll_number = roll;
    else body.designation = desig;

    const res = await apiFetch('/auth/register', { method: 'POST', body });
    showAlert('reg-success-alert', res.message || 'Account created! Redirecting to login...', 'success');
    setTimeout(() => window.location.href = `login.html?role=${regRole}`, 2000);
  } catch(e) {
    showAlert('reg-alert', e.message || 'Registration failed.');
    btn.disabled = false; btn.innerHTML = '<i class="fas fa-user-plus"></i> Create Account';
  }
}


</script>
</body>
</html>
